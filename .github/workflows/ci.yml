name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Karne motoru (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  strings:
    name: Metin anahtarları
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-strings.py

  app:
    name: Uygulama (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Simülatör seç
        run: |
          xcrun simctl list devices available iPhone
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in runtimes.items():
              if 'iOS-18' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone') and device.get('isAvailable'):
                      key = (runtime, device['name'])
                      if best is None or key > best[0]:
                          best = (key, device['udid'])
          print(best[1] if best else '')
          ")
          test -n "$UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Derle ve test et
        run: |
          set -o pipefail
          xcodebuild test \
            -project Goruldu.xcodeproj \
            -scheme Goruldu \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: unre|Test Case|Test Suite|\*\* |Executed|BUILD|FAILED|failed" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log
      - name: Hata satırları
        if: failure()
        run: grep -nE "error:|\*\* |failed|Failing" build.log | head -200 || true
      - name: Release derlemesi
        run: |
          set -o pipefail
          xcodebuild build \
            -project Goruldu.xcodeproj \
            -scheme Goruldu \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            | tee release.log | grep -E "error:|\*\* " || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" release.log
      - name: Günlükleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            build.log
            release.log
          if-no-files-found: ignore
